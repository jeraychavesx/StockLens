<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockLens</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:#050505;overflow:hidden;color:white;}

canvas{position:fixed;top:0;left:0;z-index:0;}

#app{
    width:100%;height:100vh;
    display:flex;justify-content:center;align-items:center;
    position:relative;z-index:2;
}

/* TEXTO */
.title{
    font-size:3rem;
    letter-spacing:6px;
    position:absolute;
}

.title span{
    opacity:0;
    background:linear-gradient(90deg,#a855f7,#3b82f6);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    transition:0.2s;
}

/* GLOW */
.glow{
    text-shadow:0 0 20px #3b82f6,0 0 40px #a855f7;
}

/* GLITCH */
.glitch{
    animation:glitch 0.2s infinite;
}

@keyframes glitch{
    0%{transform:translate(0);}
    20%{transform:translate(-2px,2px);}
    40%{transform:translate(2px,-2px);}
    60%{transform:translate(-2px,0);}
    80%{transform:translate(2px,2px);}
    100%{transform:translate(0);}
}

/* SENSOR */
.sensor{
    position:absolute;
    top:-20%;
    width:100%;
    height:10px;
    background:linear-gradient(90deg,transparent,#3b82f6,#a855f7,transparent);
    box-shadow:0 0 40px #3b82f6,0 0 80px #a855f7;
}

/* LOGIN */
#login{
    position:absolute;
    opacity:0;
    text-align:center;
}

.login-box{
    background:#111;
    padding:40px;
    border-radius:15px;
    width:300px;
}

.login-box *{
    opacity:0;
    transform:translateY(20px);
    transition:0.4s;
}

.show-login *{
    opacity:1 !important;
    transform:translateY(0) !important;
}

input,button{
    width:100%;
    padding:10px;
    margin:10px 0;
    border:none;
    border-radius:8px;
}

input{background:#1a1a1a;color:white;}
button{
    background:linear-gradient(90deg,#3b82f6,#a855f7);
    color:white;
    cursor:pointer;
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<div id="app">
    <div class="title" id="title"></div>
    <div class="sensor" id="sensor"></div>

    <div id="login">
        <div class="login-box" id="loginBox">
            <h2>LOGIN</h2>
            <input type="text" placeholder="Usuario">
            <input type="password" placeholder="Contraseña">
            <button>Entrar</button>
        </div>
    </div>
</div>

<!-- SONIDOS -->
<audio id="scanSound" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>
<audio id="glitchSound" src="https://assets.mixkit.co/active_storage/sfx/2605/2605-preview.mp3"></audio>

<script>
const text="STOCKLENS";
const title=document.getElementById("title");
const sensor=document.getElementById("sensor");

const scanSound=document.getElementById("scanSound");
const glitchSound=document.getElementById("glitchSound");

/* CREAR LETRAS */
text.split("").forEach(l=>{
    let span=document.createElement("span");
    span.textContent=l;
    title.appendChild(span);
});

const letters=document.querySelectorAll(".title span");

/* SONIDOS */
function playScan(){scanSound.currentTime=0;scanSound.play();}
function playGlitch(){glitchSound.currentTime=0;glitchSound.play();}

/* REVELAR */
function reveal(progress){
    letters.forEach((l,i)=>{
        if(progress>i/letters.length){
            l.style.opacity=1;
            l.classList.add("glow");
        }
    });
}

/* BORRAR CON GLITCH + PARTICULAS */
function erase(progress){
    letters.forEach((l,i)=>{
        if(progress>i/letters.length){
            l.classList.add("glitch");
            l.style.opacity=0;
            l.classList.remove("glow");

            // partículas explosión
            createParticles(l.getBoundingClientRect());
        }
    });
}

/* PARTICULAS EXPLOSION */
const canvas=document.getElementById("bg");
const ctx=canvas.getContext("2d");
canvas.width=innerWidth;
canvas.height=innerHeight;

let particles=[];

function createParticles(rect){
    for(let i=0;i<5;i++){
        particles.push({
            x:rect.left+rect.width/2,
            y:rect.top+rect.height/2,
            dx:(Math.random()-0.5)*4,
            dy:(Math.random()-0.5)*4,
            life:30
        });
    }
}

function drawParticles(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach((p,i)=>{
        ctx.fillStyle="#a855f7";
        ctx.fillRect(p.x,p.y,2,2);
        p.x+=p.dx;
        p.y+=p.dy;
        p.life--;
        if(p.life<=0) particles.splice(i,1);
    });
    requestAnimationFrame(drawParticles);
}
drawParticles();

/* ESCANEO */
function scan(dir="down",mode="reveal"){
    return new Promise(resolve=>{
        playScan();

        const start=dir==="down"?-20:110;
        const end=dir==="down"?110:-20;
        const duration=1200;
        const startTime=performance.now();

        function anim(t){
            let progress=(t-startTime)/duration;
            if(progress>1)progress=1;

            let pos=start+(end-start)*progress;
            sensor.style.top=pos+"%";

            if(dir==="down"){
                if(mode==="reveal") reveal(progress);
                if(mode==="erase") erase(progress);
            }

            if(progress<1){
                requestAnimationFrame(anim);
            }else resolve();
        }

        requestAnimationFrame(anim);
    });
}

/* SECUENCIA */
async function sequence(){

    await scan("down","reveal");
    await scan("up");

    playGlitch();
    await scan("down","erase");
    await scan("up");

    // 🔥 eliminar completamente antes del login
    title.style.display="none";

    await scan("down");

    document.getElementById("login").style.opacity=1;
    document.getElementById("loginBox").classList.add("show-login");
}

sequence();
</script>

</body>
</html>
