<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockLens - Iniciar Sesión</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #000000; /* Fondo Negro Absoluto */
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background-color: #0b0f19; /* Azul Profundo Oscuro */
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(109, 40, 217, 0.2); /* Sutil resplandor morado */
            width: 100%;
            max-width: 400px;
            border: 1px solid #6d28d9; /* Borde Morado */
        }

        .login-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .login-header h1 {
            color: #ffffff;
            font-size: 2.2rem;
            margin-bottom: 0.3rem;
            font-weight: 800;
        }

        .login-header h1 span {
            color: #8b5cf6; /* Acento Morado Brillante */
        }

        .login-header p {
            color: #3b82f6; /* Acento Azul */
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .input-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            background-color: #000000;
            border: 1px solid #3b82f640; /* Borde Azul translúcido */
            border-radius: 8px;
            color: #ffffff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: #8b5cf6; /* Cambia a Morado al enfocar */
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.4);
        }

        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .actions a {
            color: #3b82f6;
            text-decoration: none;
        }

        .actions a:hover {
            text-decoration: underline;
            color: #8b5cf6;
        }

        .btn-login {
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, #3b82f6, #6d28d9); /* Degradado Azul a Morado */
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            box-shadow: 0 0 16px rgba(139, 92, 246, 0.6);
            transform: translateY(-1px);
        }

        .btn-login:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-header">
            <h1>Stock<span>Lens</span></h1>
            <p>Gestión Inteligente</p>
        </div>
        
        <!-- El evento onsubmit redirige mediante JavaScript al archivo home.html -->
        <form onsubmit="event.preventDefault(); window.location.href='home.html';">
            <div class="input-group">
                <label for="username">Usuario o Correo</label>
                <input type="text" id="username" placeholder="Ingresa tu usuario" required>
            </div>
            
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            
            <div class="actions">
                <label style="cursor: pointer;"><input type="checkbox" style="margin-right: 4px;"> Recordarme</label>
                <a href="#">¿Olvidaste tu contraseña?</a>
            </div>
            
            <button type="submit" class="btn-login">Iniciar Sesión</button>
        </form>
    </div>

</body>
</html>
